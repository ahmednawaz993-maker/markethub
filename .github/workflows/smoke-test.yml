name: Backend smoke tests

# End-to-end health checks of the LIVE markethub-80276 backend. Each test drives
# synthetic docs (throwaway `smoke_*` UIDs) through the deployed Cloud Functions,
# asserts every effect + security guard, and cleans up everything it creates:
#   • payout        — payment-held -> buyer-confirmed -> admin-release (+ guards)
#   • cancellation  — direct cancel / request+refund / seller-approval / reject
#   • multi-seller  — master fan-out -> pay-once escrow -> delivery aggregation
# Failure of any one fails the job (steps run in order; each cleans up its own).
#
# Triggers:
#   - on push to main touching functions/** — a backend-only change no longer
#     runs the Play deploy (see that workflow's paths-ignore), so without this
#     the post-deploy check below would never fire for exactly the commits most
#     likely to break the backend
#   - after "Deploy to Google Play" finishes successfully (post-deploy check)
#   - manually from the Actions tab (workflow_dispatch)
#   - nightly (schedule) so a broken backend surfaces even without a deploy
# To make it manual-only, delete the `push`, `workflow_run` and `schedule` blocks
# below.
#
# Requires repo secret PLAY_SERVICE_ACCOUNT_JSON (the Firebase Admin SDK service
# account — same one the deploy workflow uses), which has Firestore access.

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
  workflow_run:
    workflows: ["Deploy to Google Play"]
    types: [completed]
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly

concurrency:
  group: backend-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    # For the post-deploy trigger, only run when that deploy succeeded. Manual /
    # scheduled runs have no workflow_run context, so they always proceed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Write Admin SDK service-account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "$PLAY_SERVICE_ACCOUNT_JSON" > android/play-service-account.json

      - name: Run payout smoke test
        working-directory: functions
        run: node smoke_payout_test.js

      - name: Run cancellation smoke test
        working-directory: functions
        run: node smoke_cancellation_test.js

      - name: Run multi-seller smoke test
        working-directory: functions
        run: node smoke_multiseller_test.js

      - name: Run multi-seller E2E scenario
        working-directory: functions
        run: node smoke_e2e_multiseller_test.js

      - name: Run pure logic unit tests
        working-directory: functions
        run: |
          node cancellation_logic.test.js
          node multiseller_logic.test.js
          node escrow_logic.test.js

      - name: Clean up secret on runner
        if: always()
        run: rm -f android/play-service-account.json
