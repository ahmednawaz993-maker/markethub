<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="PakBazar - Pakistan's marketplace to buy and sell cars, property, phones, electronics and more.">
  <meta name="theme-color" content="#0A1A33">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PakBazar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PakBazar - Buy & Sell in Pakistan</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    #pb-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #0A1A33, #173A6B);
      font-family: -apple-system, Roboto, Arial, sans-serif;
      transition: opacity .4s ease;
    }
    #pb-splash .pb-name { color: #fff; font-size: 34px; font-weight: 800; letter-spacing: .5px; }
    #pb-splash .pb-tag { color: rgba(255,255,255,.8); font-size: 14px; margin-top: 4px; }
    #pb-splash .pb-ring {
      width: 46px; height: 46px; margin-top: 26px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,.25); border-top-color: #fff;
      animation: pb-spin 1s linear infinite;
    }
    @keyframes pb-spin { to { transform: rotate(360deg); } }
  </style>
  <div id="pb-splash">
    <div class="pb-name">PakBazar</div>
    <div class="pb-tag">Pakistan ka apna online bazaar</div>
    <div class="pb-ring"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('pb-splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 400); }
    });
  </script>

  <!-- Purge any service worker + caches left by earlier builds. A stale SW
       serves cached code (even index.html) and ignores server cache headers,
       which made deployed changes not appear on the live site. Unregistering
       it makes the app always load the freshly deployed bundle. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        for (var i = 0; i < keys.length; i++) { caches.delete(keys[i]); }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
