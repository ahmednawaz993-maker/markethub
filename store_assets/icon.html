<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;}
  .icon{width:100vw;height:100vh;
    background:linear-gradient(135deg,#013318 0%,#015127 45%,#0A7D3B 100%);
    display:flex;align-items:center;justify-content:center;position:relative;
    font-family:Arial,Helvetica,sans-serif;overflow:hidden;}
  .pb{color:#fff;font-weight:900;font-size:40vw;letter-spacing:-2vw;
    text-shadow:0 1vw 3vw rgba(0,0,0,.25);}
  .star{position:absolute;top:11%;right:15%;color:#C9A227;font-size:15vw;
    line-height:1;text-shadow:0 .5vw 1.5vw rgba(0,0,0,.25);}
  .moon{position:absolute;bottom:13%;left:14%;width:13vw;height:13vw;
    border-radius:50%;box-shadow:5vw 0 0 0 #C9A227;}
</style></head>
<body><div class="icon">
  <div class="moon"></div>
  <div class="pb">PB</div>
  <div class="star">&#9733;</div>
</div></body></html>
