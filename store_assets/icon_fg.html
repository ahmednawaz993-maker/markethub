<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;background:transparent;}
  .wrap{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;}
  .grp{position:relative;width:60vw;height:60vw;display:flex;align-items:center;justify-content:center;}
  .pb{color:#fff;font-weight:900;font-size:30vw;letter-spacing:-1.5vw;
    font-family:Arial,Helvetica,sans-serif;}
  .star{position:absolute;top:-3vw;right:-3vw;color:#C9A227;font-size:13vw;line-height:1;}
  .moon{position:absolute;bottom:-1vw;left:-2vw;width:10vw;height:10vw;
    border-radius:50%;box-shadow:4vw 0 0 0 #C9A227;}
</style></head>
<body><div class="wrap"><div class="grp">
  <div class="moon"></div>
  <div class="pb">PB</div>
  <div class="star">&#9733;</div>
</div></div></body></html>
