<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;}
  .fg{width:100vw;height:100vh;
    background:linear-gradient(120deg,#013318 0%,#015127 50%,#0A7D3B 100%);
    display:flex;align-items:center;position:relative;overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;}
  .txt{padding:0 7%;color:#fff;z-index:2;}
  .brand{font-size:8.5vw;font-weight:900;letter-spacing:-.3vw;margin:0;}
  .tag{font-size:3.2vw;margin:1.5vw 0 0;color:#eafff1;font-weight:500;}
  .pill{display:inline-block;margin-top:3vw;background:#C9A227;color:#fff;
    font-weight:bold;font-size:2.6vw;padding:1.4vw 3.2vw;border-radius:99px;}
  .moon{position:absolute;right:9%;top:50%;transform:translateY(-50%);
    width:18vh;height:18vh;border-radius:50%;background:transparent;
    box-shadow:7vh 0 0 0 rgba(255,255,255,.12);}
  .star{position:absolute;right:7%;top:20%;color:#C9A227;font-size:9vh;}
</style></head>
<body><div class="fg">
  <div class="moon"></div>
  <div class="star">&#9733;</div>
  <div class="txt">
    <p class="brand">PakBazar</p>
    <p class="tag">Buy &amp; Sell across Pakistan</p>
    <span class="pill">Cars &middot; Property &middot; Mobiles &middot; &amp; more</span>
  </div>
</div></body></html>
